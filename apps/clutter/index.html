<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clutter — Reseller OS</title>
<style>
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f6f8;color:#111827}
.clutter-shell{max-width:1150px;margin:auto;padding:18px}.clutter-header{background:#111827;color:white;padding:16px 20px;border-radius:16px;display:flex;justify-content:space-between;align-items:center}.clutter-header b{font-size:21px}.clutter-header span{margin-left:10px;color:#cbd5e1}.clutter-header select{padding:9px;border-radius:9px}
.clutter-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.clutter-stats>div{background:white;border:1px solid #e5e7eb;border-radius:15px;padding:17px}.clutter-stats small{display:block;color:#667085}.clutter-stats strong{font-size:25px;display:block;margin-top:6px}
.clutter-tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.clutter-tabs button,.actions button,.primary{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.clutter-tabs button{background:white}.clutter-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.primary{background:#111827;color:#fff}.clutter-list{display:grid;gap:12px}.clutter-card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:16px;display:grid;grid-template-columns:1.5fr 1fr auto;gap:14px;align-items:center}.clutter-card small{color:#667085}.clutter-card h3{margin:5px 0}.clutter-card p{margin:5px 0;color:#667085}.prices{display:flex;flex-direction:column;gap:4px}.prices strong{font-size:18px}.actions{display:flex;gap:7px}.actions button{background:#111827;color:#fff}.actions .danger{background:#b42318}.empty{background:white;border:1px dashed #cbd5e1;border-radius:14px;padding:30px;text-align:center;color:#667085}
@media(max-width:700px){.clutter-stats{grid-template-columns:repeat(2,1fr)}.clutter-card{grid-template-columns:1fr}.clutter-toolbar{align-items:flex-start;flex-direction:column}.clutter-header span{display:block;margin:4px 0 0}}
</style></head>
<body><div data-clutter-app></div><script src="./app.js"></script></body></html>
