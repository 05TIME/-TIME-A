<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clutter — Reseller OS</title>
<style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f6f8;color:#111827}.clutter-shell{max-width:1150px;margin:auto;padding:18px}.clutter-header{background:#111827;color:#fff;padding:16px 20px;border-radius:16px;display:flex;justify-content:space-between;align-items:center}.clutter-header b{font-size:21px}.clutter-header span{margin-left:10px;color:#cbd5e1}.clutter-header select{padding:9px;border-radius:9px}.clutter-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.clutter-stats>div{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:17px}.clutter-stats small{display:block;color:#667085}.clutter-stats strong{font-size:25px;display:block;margin-top:6px}.clutter-tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.clutter-tabs button,.actions button,.primary{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.clutter-tabs button{background:#fff}.clutter-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.primary{background:#111827;color:#fff}.clutter-list{display:grid;gap:12px}.clutter-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;display:grid;grid-template-columns:1.5fr 1fr auto;gap:14px;align-items:center}.clutter-card small{color:#667085}.clutter-card h3{margin:5px 0}.clutter-card p{margin:5px 0;color:#667085}.prices{display:flex;flex-direction:column;gap:4px}.prices strong{font-size:18px}.actions{display:flex;gap:7px}.actions button{background:#111827;color:#fff}.actions .danger{background:#b42318}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:14px;padding:30px;text-align:center;color:#667085}.modal{position:fixed;inset:0;background:rgba(15,23,42,.58);display:grid;place-items:center;padding:18px}.modal[hidden]{display:none}.modal-card{background:#fff;border-radius:18px;padding:20px;max-width:560px;width:100%;box-sizing:border-box}.field{margin:10px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px;box-sizing:border-box}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.media-help{font-size:12px;color:#667085;margin-top:5px}@media(max-width:700px){.clutter-stats{grid-template-columns:repeat(2,1fr)}.clutter-card{grid-template-columns:1fr}.clutter-toolbar{align-items:flex-start;flex-direction:column}.clutter-header span{display:block;margin:4px 0 0}}</style></head>
<body><div data-clutter-app></div>
<div id="intake-modal" class="modal" hidden><form id="clutter-seller-form" class="modal-card">
<h2>Submit an item for sale</h2><p class="media-help">Send clear photos and, for electronics/appliances, a short working-condition video when possible.</p>
<div class="field"><label>Item name</label><input name="title" required placeholder="e.g. Samsung 55-inch TV"></div>
<div class="field"><label>Category</label><select name="category"><option>Phones</option><option>Electronics</option><option>Appliances</option><option>Furniture</option><option>Clothing</option><option>Other</option></select></div>
<div class="field"><label>Condition</label><input name="condition" placeholder="Used, excellent, minor fault, etc."></div>
<div class="field"><label>Seller asking price (₦)</label><input name="askingPrice" type="number" min="0" inputmode="numeric"></div>
<div class="field"><label>Location</label><input name="location" placeholder="City / area"></div>
<div class="field"><label>Description</label><textarea name="description" rows="3" placeholder="Age, faults, accessories, ownership details…"></textarea></div>
<div class="field"><label>Photos / videos</label><input id="clutter-media-files" type="file" accept="image/*,video/*" multiple><div class="media-help">Photos and videos stay private for verification.</div></div>
<div id="clutter-upload-progress" class="media-help"></div><div id="clutter-submit-result"></div>
<div class="modal-actions"><button type="button" onclick="Clutter.closeIntake()">Cancel</button><button class="primary" type="submit">Submit for verification</button></div>
</form></div>
<script src="./app.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">import { createSupabaseClient } from "./supabase-client.js"; import { createPortal } from "./portal.js"; import { uploadItemMedia } from "./media.js"; import { createSellerForm } from "./seller-form.js"; window.createSupabaseClient=createSupabaseClient; window.createPortal=createPortal; window.uploadItemMedia=uploadItemMedia; window.addEventListener("DOMContentLoaded",()=>{const supabase=createSupabaseClient(); const portal=createPortal(supabase); Clutter.init(portal); createSellerForm({supabase,submitItem:portal.submitItem,uploadItemMedia,onSubmitted:()=>Clutter.refresh()});});</script></body></html>
