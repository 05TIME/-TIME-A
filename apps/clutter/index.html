<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clutter — Reseller OS</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f6f8;color:#111827}header{background:#111827;color:white;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:900}.wrap{max-width:1150px;margin:auto;padding:24px}.hero{background:white;border-radius:22px;padding:24px;margin-bottom:18px}.hero h1{font-size:36px;margin:0 0 8px}.muted{color:#667085}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:white;padding:18px;border-radius:16px;border:1px solid #e5e7eb}.num{font-size:25px;font-weight:900}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tabs button,.action{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.tabs button{background:white}.active{background:#111827!important;color:white}.panel{background:white;border-radius:18px;padding:18px;border:1px solid #e5e7eb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{border:1px solid #e5e7eb;border-radius:16px;padding:16px}.tag{display:inline-block;padding:5px 8px;border-radius:8px;background:#eef2ff;font-size:12px;font-weight:800}.money{font-size:21px;font-weight:900}.actions{display:flex;gap:8px;margin-top:12px}.primary{background:#111827;color:#fff}.green{background:#16a34a;color:#fff}.orange{background:#f59e0b;color:#111}.input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}.hero h1{font-size:29px}}</style></head><body><header><div class="logo">CLUTTER</div><div>Reseller Operating App</div></header><main class="wrap"><section class="hero"><h1>Buy smart. Verify. Resell.</h1><p class="muted">One simple workspace for second-hand products — from seller submission to verified resale.</p></section><section class="stats"><div class="stat"><div class="muted">Pending review</div><div class="num">12</div></div><div class="stat"><div class="muted">In inventory</div><div class="num">48</div></div><div class="stat"><div class="muted">Listed for sale</div><div class="num">31</div></div><div class="stat"><div class="muted">Expected margin</div><div class="num">₦2.4m</div></div></section><div class="tabs"><button class="active" onclick="show('intake',this)">Seller Intake</button><button onclick="show('agents',this)">Agent Review</button><button onclick="show('inventory',this)">Inventory</button><button onclick="show('sales',this)">Resale</button></div><section id="content" class="panel"></section></main><script>
const data={intake:[['iPhone 13 128GB','Seller: Daniel','₦380,000','Awaiting video'],['Leather Sofa Set','Seller: Grace','₦150,000','Agent requested photos'],['Nike Sneakers','Seller: Chris','₦65,000','Ready for valuation']],agents:[['iPhone 13 128GB','Agent: Tunde','Buy target ₦330,000','Video received'],['LG Inverter AC','Agent: Mary','Buy target ₦210,000','Inspection complete'],['Dining Set','Agent: Femi','Buy target ₦95,000','Needs clearer video']],inventory:[['iPhone 12','Cost ₦290,000','List ₦340,000','Margin ₦50,000'],['Samsung TV 55″','Cost ₦230,000','List ₦285,000','Margin ₦55,000'],['Office Chair','Cost ₦45,000','List ₦65,000','Margin ₦20,000']],sales:[['iPhone 12','₦340,000','Buyer via WhatsApp','Pending payment'],['Samsung TV 55″','₦285,000','Buyer: Ada','Paid'],['Office Chair','₦65,000','Buyer: Kelechi','Delivery pending']]};
function show(tab,el){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('content').innerHTML='<h2>'+({intake:'New items submitted',agents:'Agent verification queue',inventory:'Company inventory',sales:'Resale pipeline'}[tab])+'</h2><div class="grid">'+data[tab].map(x=>'<div class="card"><span class="tag">'+x[3]+'</span><h3>'+x[0]+'</h3><p class="muted">'+x[1]+'</p><div class="money">'+x[2]+'</div><div class="actions"><button class="action primary">'+(tab==='agents'?'Review':tab==='intake'?'Open':'View')+'</button><button class="action green">WhatsApp</button></div></div>').join('')+'</div>'}show('intake',document.querySelector('.tabs button'));
</script></body></html>
