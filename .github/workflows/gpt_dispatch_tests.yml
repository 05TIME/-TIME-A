name: TIMEŒ GPT Dispatch Test Runner

on:
  repository_dispatch:
    types: [run_telemetry_test, run_all_tests]
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  execute-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio uvicorn fastapi pygithub
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Log Received Dispatch Payload
        run: |
          echo "Triggered by Event: ${{ github.event.action }}"
          echo "Client Payload Buffer Size: ${{ github.event.client_payload.buffer_size }}"

      - name: Run Pytest Suite
        run: |
          pytest -v --tb=short
